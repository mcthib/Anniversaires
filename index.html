<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anniversaires</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="carnet.css">
    <script src="dates.js" defer></script>
    <script src="bundle.js" defer></script>
</head>
<body>
    <main>
        <header class="page-header">
            <h1>Anniversaires</h1>
            <img src="favicon.svg" alt="" width="40" height="40">
        </header>
        <section class="next-birthday" id="next-birthday" aria-labelledby="next-title" hidden>
            <h2 id="next-title">Prochain anniversaire</h2>
            <p id="next-name"></p>
            <p id="next-details"></p>
        </section>
        <div class="months" id="birthdays"></div>
        <p id="empty-birthdays" hidden>Aucun anniversaire à afficher.</p>
    </main>
</body>
</html>
